{% extends 'core/base.html' %}{% block title %}Categorias{% endblock %}{% block content %}<div class="page-head"><h1>Categorias</h1><a class="btn btn-primary" href="{% url 'category_create' %}">Nova categoria</a></div><div class="table-responsive"><table class="table"><thead><tr><th>Nome</th><th>Situação</th><th>Ações</th></tr></thead><tbody>{% for item in categories %}<tr><td>{{ item.name }}</td><td>{{ item.is_active|yesno:'Ativa,Inativa' }}</td><td><a href="{% url 'category_edit' item.pk %}">Editar</a></td></tr>{% empty %}<tr><td colspan="3">Nenhuma categoria cadastrada.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
