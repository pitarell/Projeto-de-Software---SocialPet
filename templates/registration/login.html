{% load static %}<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — SocialPet</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{% static 'core/app.css' %}"></head><body class="login-page"><main class="login-card"><div class="login-brand" aria-hidden="true">🐾</div><h1>SocialPet</h1><p>LivrePet · Gestão de doações e estoque</p>{% for message in messages %}<div class="alert alert-danger" role="alert">{{ message }}</div>{% endfor %}{% if form.errors %}<div class="alert alert-danger" role="alert">Usuário ou senha inválidos.</div>{% endif %}<form method="post" novalidate>{% csrf_token %}<div><label for="id_username">Usuário</label><input class="form-control" id="id_username" name="username" autocomplete="username" required autofocus></div><div><label for="id_password">Senha</label><input class="form-control" type="password" id="id_password" name="password" autocomplete="current-password" required></div><button class="btn btn-primary w-100" type="submit">Entrar</button></form></main></body></html>
